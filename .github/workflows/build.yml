name: Build Dale V10.0.3 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack and test
        run: |
          unzip -t Dale_V10_0_3.zip
          unzip -o Dale_V10_0_3.zip
          cd Dale
          mkdir -p test-classes
          SRC=app/src/main/java/com/dale/todo
          javac -d test-classes "$SRC"/{TaskTitle,ExplicitPlan,AiJsonEnvelope,CategoryLogic,CommandIntent,AssistantLearning,DailyReview}.java tests/*.java
          for f in tests/*Test.java; do java -cp test-classes "com.dale.todo.$(basename "$f" .java)" || exit 1; done
      - name: Install Android tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > Dale/local.properties
      - name: Voice model
        run: |
          curl -fL --retry 5 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o model.zip
          unzip -tq model.zip
          unzip -q model.zip
          mkdir -p Dale/app/src/main/assets
          rm -rf Dale/app/src/main/assets/model-cn
          mv vosk-model-small-cn-0.22 Dale/app/src/main/assets/model-cn
      - name: Build signed APK
        env:
          DALE_SIGNING: ${{ secrets.DALE_SIGNING }}
        run: |
          test -n "$DALE_SIGNING"
          export DALE_PASSWORD="${DALE_SIGNING%%:*}"
          echo "::add-mask::$DALE_PASSWORD"
          export DALE_KEYSTORE="$RUNNER_TEMP/dale.p12"
          printf '%s' "${DALE_SIGNING#*:}" | base64 -d > "$DALE_KEYSTORE"
          chmod 600 "$DALE_KEYSTORE"
          cd Dale
          gradle assembleRelease --stacktrace
      - name: Verify signature
        run: |
          APK=$(find Dale/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Dale-V10.0.3-APK
          path: Dale/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
