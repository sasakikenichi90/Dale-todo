name: Build Dale APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: unzip -o Dale_V6.zip

      - name: Download Chinese voice model
        run: |
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o model.zip
          unzip -q model.zip
          mkdir -p Dale/app/src/main/assets
          mv vosk-model-small-cn-0.22 Dale/app/src/main/assets/model-cn

      - name: Build signed APK
        env:
          DALE_SIGNING: ${{ secrets.DALE_SIGNING }}
        run: |
          set -e
          test -n "$DALE_SIGNING"
          export DALE_PASSWORD="${DALE_SIGNING%%:*}"
          echo "::add-mask::$DALE_PASSWORD"
          export DALE_KEYSTORE="$RUNNER_TEMP/dale.p12"
          printf '%s' "${DALE_SIGNING#*:}" | base64 -d > "$DALE_KEYSTORE"
          cd Dale
          gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Dale-V6-APK
          path: Dale/app/build/outputs/apk/release/*.apk
