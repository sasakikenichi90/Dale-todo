name: Build Dale APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: unzip -o Dale_V2.zip

      - name: Build APK
        run: |
          cd Dale
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Dale-V2-APK
          path: Dale/app/build/outputs/apk/debug/*.apk
