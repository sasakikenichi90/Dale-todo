name: Build Dale APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          unzip -t Dale_V8_9_RC2_fixed.zip
          unzip -o Dale_V8_9_RC2_fixed.zip

      - name: Install native build tools
        run: |
          set -e
          command -v sdkmanager
          sdkmanager --version
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

          echo "Android native build tools ready"

      - name: Download Chinese voice model
        run: |
          set -e
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o model.zip
          unzip -q model.zip
          mkdir -p Dale/app/src/main/assets
          rm -rf Dale/app/src/main/assets/model-cn
          mv vosk-model-small-cn-0.22 Dale/app/src/main/assets/model-cn

      - name: Build signed APK
        env:
          DALE_SIGNING: ${{ secrets.DALE_SIGNING }}
        run: |
          set -e
          test -n "$DALE_SIGNING"
          export DALE_PASSWORD="${DALE_SIGNING%%:*}"
          echo "::add-mask::$DALE_PASSWORD"
          export DALE_KEYSTORE="$RUNNER_TEMP/dale.p12"
          printf '%s' "${DALE_SIGNING#*:}" | base64 -d > "$DALE_KEYSTORE"
          cd Dale
          gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -e
          APK=$(find Dale/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$TOOL" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Dale-V8.9-RC2-AI-APK
          path: Dale/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
