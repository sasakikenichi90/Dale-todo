name: Build Dale APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: unzip -o Dale_Android.zip

      - name: Build APK
        run: |
          cd Dale
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Dale-APK
          path: Dale/app/build/outputs/apk/debug/*.apk
